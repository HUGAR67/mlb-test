<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB 球員經營與對戰遊戲</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a252f;
            color: #fff;
        }
        h1, h2, h3 { text-align: center; color: #f39c12; margin-top: 5px; }

        /* 頂部資產與勝績儀表板 */
        .dashboard {
            display: flex;
            justify-content: space-around;
            background: #2c3e50;
            padding: 15px;
            border-radius: 10px;
            max-width: 900px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 18px;
            font-weight: bold;
        }
        .money-text { color: #2ecc71; }
        .record-text { color: #3498db; }

        /* 頁籤選單 */
        .tab-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background-color: #34495e;
            color: #fff;
            border-radius: 8px;
            transition: 0.3s;
        }
        .tab-button.active { background-color: #f39c12; color: #1a252f; }
        .tab-button:hover:not(.active) { background-color: #4a6572; }

        .page-content { display: none; max-width: 900px; margin: 0 auto; }
        .page-content.active { display: block; }

        /* === 抽卡區 === */
        .gacha-box {
            text-align: center;
            background: #2c3e50;
            padding: 25px;
            border-radius: 10px;
        }
        .btn-gacha {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin: 10px;
            transition: 0.2s;
        }
        .btn-single { background-color: #27ae60; color: white; }
        .btn-ten { background-color: #e67e22; color: white; }
        .btn-gacha:hover { transform: scale(1.05); }

        .card-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }
        .card {
            width: 140px;
            background: #34495e;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .card.batter { border-color: #e67e22; }
        .card.pitcher { border-color: #2980b9; }

        /* === 陣容與對戰區 === */
        .section-box {
            background: #2c3e50;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .lineup-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        select {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border-radius: 4px;
            background: #ecf0f1;
            border: none;
            margin-top: 5px;
        }
        .btn-sim {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        .btn-sim:hover { background-color: #c0392b; }
        .btn-playoff { background-color: #8e44ad; }
        .btn-playoff:hover { background-color: #9b59b6; }

        /* 戰報播報面板 */
        .game-log {
            background: #111;
            color: #00ff66;
            font-family: monospace;
            padding: 15px;
            border-radius: 8px;
            height: 180px;
            overflow-y: auto;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>⚾ MLB 球團總經理：賽事與抽卡系統</h1>

    <!-- 儀表板 -->
    <div class="dashboard">
        <div>💵 球團資金: <span id="userMoney" class="money-text">$1,000</span></div>
        <div>🏆 例行賽戰績: <span id="userRecord" class="record-text">0 勝 - 0 敗</span></div>
    </div>

    <!-- 頁籤選單 -->
    <div class="tab-container">
        <button class="tab-button active" onclick="switchTab('gameTab', this)">⚔️ 排定陣容 & 模擬比賽</button>
        <button class="tab-button" onclick="switchTab('gachaTab', this)">🎰 球員轉蛋抽卡</button>
        <button class="tab-button" onclick="switchTab('inventoryTab', this)">🎒 我的球員背包</button>
    </div>

    <!-- 頁面一：模擬對戰與陣容排定 -->
    <div id="gameTab" class="page-content active">
        <div class="section-box">
            <h3>📋 排定先發陣容 (打線 1~9 棒 + 先發投手)</h3>
            <div class="lineup-grid">
                <div>
                    <label>🥎 先發投手 (SP):</label>
                    <select id="select-sp"></select>
                </div>
                <!-- 1 ~ 9 棒動態生成 -->
                <div id="battersSelectGroup" style="grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;"></div>
            </div>
        </div>

        <div class="section-box">
            <h3>🏟️ 賽事模擬開打</h3>
            <button class="btn-sim" onclick="simulateGame('regular')">⚾ 開始模擬例行賽 (贏球獎勵 $200)</button>
            <button class="btn-sim btn-playoff" onclick="simulateGame('playoff')">🏆 開始季後賽挑戰 (需要 5 勝，贏球獎勵 $1,000)</button>

            <!-- 文字戰報 -->
            <div id="gameLog" class="game-log">點擊上方按鈕開始模擬賽事...</div>
        </div>
    </div>

    <!-- 頁面二：抽卡區 -->
    <div id="gachaTab" class="page-content">
        <div class="gacha-box">
            <h2>球員卡池</h2>
            <p>單抽 $100 | 十連抽 $1,000</p>
            <button class="btn-gacha btn-single" onclick="drawGacha(1)">單抽 ⚾</button>
            <button class="btn-gacha btn-ten" onclick="drawGacha(10)">十連抽 ⚡</button>

            <div id="gachaResult" class="card-grid"></div>
        </div>
    </div>

    <!-- 頁面三：背包庫 -->
    <div id="inventoryTab" class="page-content">
        <div class="section-box">
            <h3>🎒 目前擁有的球員</h3>
            <div id="inventoryGrid" class="card-grid"></div>
        </div>
    </div>

    <script>
        let userMoney = 1000;
        let wins = 0;
        let losses = 0;

        let allBattersData = [];
        let allPitchersData = [];

        let myBatters = []; // 玩家擁有的打者
        let myPitchers = []; // 玩家擁有的投手

        // 預設預設基本球員 (避免剛開始背包為空)
        const defaultBatter = { "NAME": "新秀打者", "TEAM": "自由球員", "HR": "5", "AVG": ".220" };
        const defaultPitcher = { "NAME": "新秀投手", "TEAM": "自由球員", "ERA": "4.50", "SO": "30" };

        async function initGame() {
            try {
                const bRes = await fetch('batter.json').then(res => res.json());
                const pRes = await fetch('pitcher.json').then(res => res.json());

                if (bRes) allBattersData = bRes.slice(1);
                if (pRes) allPitchersData = pRes.slice(1);

                // 給玩家初階基本球員
                for(let i=0; i<9; i++) myBatters.push({ ...defaultBatter, NAME: `預設打者 ${i+1} 號` });
                myPitchers.push({ ...defaultPitcher, NAME: "預設先發投手" });

                updateUI();
                renderLineupSelects();
            } catch (err) {
                console.error("資料讀取失敗:", err);
            }
        }

        // 抽卡功能
        function drawGacha(count) {
            const cost = count === 1 ? 100 : 1000;
            if (userMoney < cost) {
                alert("球團資金不足！請先進行比賽賺取資金。");
                return;
            }

            userMoney -= cost;
            const resultBox = document.getElementById('gachaResult');
            resultBox.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const isBatter = Math.random() > 0.4; // 60% 機率打者，40% 投手
                let p = null;

                if (isBatter && allBattersData.length > 0) {
                    p = allBattersData[Math.floor(Math.random() * allBattersData.length)];
                    myBatters.push(p);
                } else if (allPitchersData.length > 0) {
                    p = allPitchersData[Math.floor(Math.random() * allPitchersData.length)];
                    myPitchers.push(p);
                }

                if (p) {
                    const keys = Object.keys(p);
                    const name = p[keys[0]] || '球員';
                    const team = p[keys[1]] || '';

                    const card = document.createElement('div');
                    card.className = `card ${isBatter ? 'batter' : 'pitcher'}`;
                    card.innerHTML = `
                        <strong>${isBatter ? '⚾ 打者' : '🥎 投手'}</strong><br>
                        <span style="font-size:16px;">${name}</span><br>
                        <small>${team}</small>
                    `;
                    resultBox.appendChild(card);
                }
            }

            updateUI();
            renderLineupSelects();
            renderInventory();
        }

        // 動態生成 1~9 棒選單
        function renderLineupSelects() {
            const group = document.getElementById('battersSelectGroup');
            group.innerHTML = '';

            // 下拉投手
            const spSelect = document.getElementById('select-sp');
            spSelect.innerHTML = '';
            myPitchers.forEach((p, idx) => {
                const name = Object.values(p)[0];
                spSelect.innerHTML += `<option value="${idx}">${name}</option>`;
            });

            // 下拉 1~9 棒打者
            for (let i = 1; i <= 9; i++) {
                let optionsHtml = '';
                myBatters.forEach((b, idx) => {
                    const name = Object.values(b)[0];
                    // 預設每棒選不一樣的人
                    const selected = (idx === (i - 1) % myBatters.length) ? 'selected' : '';
                    optionsHtml += `<option value="${idx}" ${selected}>${name}</option>`;
                });

                group.innerHTML += `
                    <div>
                        <label>第 ${i} 棒:</label>
                        <select id="select-b${i}">${optionsHtml}</select>
                    </div>
                `;
            }
        }

        // 模擬比賽邏輯
        function simulateGame(type) {
            if (type === 'playoff' && wins < 5) {
                alert("季後賽資格不足！必須在例行賽先獲得 5 勝。");
                return;
            }

            const logBox = document.getElementById('gameLog');
            logBox.innerHTML = `=== ${type === 'playoff' ? '🔥 季後賽' : '⚾ 例行賽'} 開打 ===<br>`;

            // 簡單戰力計算 (隨機值 + 背包強度)
            let myPower = 50 + (myBatters.length * 2) + Math.floor(Math.random() * 40);
            let oppPower = type === 'playoff' ? 85 + Math.floor(Math.random() * 30) : 60 + Math.floor(Math.random() * 30);

            let myScore = 0;
            let oppScore = 0;

            // 模擬 9 局比分
            for (let inning = 1; inning <= 9; inning++) {
                let myInningRun = Math.random() * myPower > 45 ? Math.floor(Math.random() * 3) : 0;
                let oppInningRun = Math.random() * oppPower > 45 ? Math.floor(Math.random() * 3) : 0;

                myScore += myInningRun;
                oppScore += oppInningRun;

                if (myInningRun > 0 || oppInningRun > 0) {
                    logBox.innerHTML += `第 ${inning} 局：我方 +${myInningRun} 分 | 對手 +${oppInningRun} 分<br>`;
                }
            }

            // 平局自動打延長賽
            if (myScore === oppScore) {
                myScore += Math.random() > 0.5 ? 1 : 0;
                oppScore += (myScore === oppScore) ? 1 : 0;
            }

            logBox.innerHTML += `<br><strong>比賽結束！最終比分：我方 ${myScore} vs ${oppScore} 對手</strong><br>`;

            if (myScore > oppScore) {
                const reward = type === 'playoff' ? 1000 : 200;
                wins++;
                userMoney += reward;
                logBox.innerHTML += `<span style="color:#00ff66;">🎉 贏得比賽！戰績 +1 勝，獎勵金 +$${reward}！</span><br>`;
            } else {
                losses++;
                userMoney += 50;
                logBox.innerHTML += `<span style="color:#ff4d4d;">❌ 遺憾吞敗！獲得參賽補助金 +$50。</span><br>`;
            }

            logBox.scrollTop = logBox.scrollHeight;
            updateUI();
        }

        // 渲染背包庫
        function renderInventory() {
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = '';

            myBatters.forEach(b => {
                const name = Object.values(b)[0];
                grid.innerHTML += `<div class="card batter">⚾ 打者<br><strong>${name}</strong></div>`;
            });
            myPitchers.forEach(p => {
                const name = Object.values(p)[0];
                grid.innerHTML += `<div class="card pitcher">🥎 投手<br><strong>${name}</strong></div>`;
            });
        }

        function updateUI() {
            document.getElementById('userMoney').textContent = `$${userMoney.toLocaleString()}`;
            document.getElementById('userRecord').textContent = `${wins} 勝 - ${losses} 敗`;
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));

            btn.classList.add('active');
            document.getElementById(tabId).classList.add('active');

            if (tabId === 'inventoryTab') renderInventory();
        }

        window.onload = initGame;
    </script>
</body>
</html>
