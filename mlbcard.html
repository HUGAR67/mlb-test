<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB 球員抽卡系統</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1e272e;
            color: #fff;
        }
        h1, h2 { text-align: center; color: #f5cd79; }
        
        /* 導覽頁籤 */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .tab-button {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background-color: #485460;
            color: #fff;
            border-radius: 8px;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .tab-button.active { background-color: #f5cd79; color: #1e272e; }
        .tab-button:hover:not(.active) { background-color: #576574; }

        /* === 抽卡區塊 === */
        .gacha-section {
            text-align: center;
            background: #2c3e50;
            padding: 30px;
            border-radius: 16px;
            max-width: 950px;
            margin: 0 auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .btn-gacha {
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-single { background-color: #3498db; color: white; }
        .btn-ten { background-color: #e67e22; color: white; }
        .btn-gacha:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        /* 高級感卡片展示區 */
        .card-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            width: 170px;
            height: 230px;
            background: linear-gradient(145deg, #2c3e50, #34495e);
            border: 3px solid #bdc3c7;
            border-radius: 12px;
            padding: 15px 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .card.batter { border-color: #f39c12; background: linear-gradient(145deg, #342210, #2c3e50); }
        .card.pitcher { border-color: #2980b9; background: linear-gradient(145deg, #102634, #2c3e50); }
        
        .card-type {
            font-size: 13px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            color: white;
            letter-spacing: 1px;
        }
        .card-type.batter { background-color: #e67e22; }
        .card-type.pitcher { background-color: #2980b9; }

        /* 球員名字加大 */
        .card-name { 
            font-size: 22px; 
            font-weight: 800; 
            text-align: center; 
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            line-height: 1.2;
            word-break: break-word;
            margin: auto 0;
        }
        .card-team { 
            font-size: 14px; 
            color: #f5cd79; 
            font-weight: 600;
        }
    </style>
</head>
<body>

    <h1>⚾ MLB 球員卡池與資料庫</h1>

    <!-- 頁籤導覽：所有球員庫直接跳轉至 mlbplayers.html -->
    <div class="tab-container">
        <button class="tab-button active">🎰 球員抽卡區</button>
        <button class="tab-button" onclick="location.href='mlbplayers.html'">📋 所有球員庫</button>
    </div>

    <!-- 抽卡主區塊 -->
    <div class="gacha-section">
        <h2>球員卡池抽卡</h2>
        <div>
            <button class="btn-gacha btn-single" onclick="drawCards(1)">單抽 ⚾</button>
            <button class="btn-gacha btn-ten" onclick="drawCards(10)">十連抽 ⚡</button>
        </div>
        <div id="cardResult" class="card-grid"></div>
    </div>

    <script>
        let allPlayers = [];

        // 初始化：讀取打者與投手 JSON 資料
        async function initData() {
            try {
                const [batterRes, pitcherRes] = await Promise.all([
                    fetch('batter.json').then(res => res.json()),
                    fetch('pitcher.json').then(res => res.json())
                ]);

                if (batterRes && batterRes.length > 0) {
                    batterRes.slice(1).forEach(item => {
                        allPlayers.push({ ...item, _type: '打者' });
                    });
                }

                if (pitcherRes && pitcherRes.length > 0) {
                    pitcherRes.slice(1).forEach(item => {
                        allPlayers.push({ ...item, _type: '投手' });
                    });
                }
            } catch (err) {
                console.error("資料載入失敗:", err);
            }
        }

        // 精準尋求「名字」與「球隊」欄位，忽視 ID 或背號
        function getPlayerData(player) {
            let name = '未知球員';
            let team = '';

            for (let key in player) {
                if (key.startsWith('_')) continue;
                const lowerKey = key.toLowerCase();

                // 搜尋包含 Name 或 姓名 的 Key
                if (!name || name === '未知球員') {
                    if (lowerKey.includes('name') || lowerKey.includes('player') || lowerKey.includes('姓名') || lowerKey.includes('球員')) {
                        name = player[key];
                    }
                }
                // 搜尋包含 Team 或 隊伍 的 Key
                if (lowerKey.includes('team') || lowerKey.includes('隊伍') || lowerKey.includes('球隊')) {
                    team = player[key];
                }
            }

            // 若找不到特徵 Key，預設取前兩個欄位
            if (name === '未知球員') {
                const keys = Object.keys(player).filter(k => !k.startsWith('_'));
                name = player[keys[0]] || '未知球員';
                team = player[keys[1]] || '';
            }

            return { name, team };
        }

        // 抽卡邏輯
        function drawCards(count) {
            const resultContainer = document.getElementById('cardResult');
            resultContainer.innerHTML = '';

            if (allPlayers.length === 0) {
                resultContainer.innerHTML = '<p style="color: #f5cd79;">球員資料載入中，請稍後再試...</p>';
                return;
            }

            for (let i = 0; i < count; i++) {
                const randomIndex = Math.floor(Math.random() * allPlayers.length);
                const player = allPlayers[randomIndex];

                const { name, team } = getPlayerData(player);

                const card = document.createElement('div');
                card.className = `card ${player._type === '打者' ? 'batter' : 'pitcher'}`;
                
                card.innerHTML = `
                    <span class="card-type ${player._type === '打者' ? 'batter' : 'pitcher'}">${player._type}</span>
                    <div class="card-name">${name}</div>
                    <div class="card-team">${team}</div>
                `;

                resultContainer.appendChild(card);
            }
        }

        // 頁面初次載入
        window.onload = initData;
    </script>
</body>
</html>
