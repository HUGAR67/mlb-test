<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB 球員資料庫</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }
        h2 { color: #333; margin-bottom: 15px; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-button {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background-color: #e0e0e0;
            color: #333;
            border-radius: 6px 6px 0 0;
            transition: 0.3s;
        }
        .tab-button.active { background-color: #2c3e50; color: white; }
        .tab-button:hover:not(.active) { background-color: #d0d0d0; }
        .search-container { margin-bottom: 15px; }
        .search-input {
            width: 100%;
            max-width: 300px;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .table-container {
            overflow-x: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background: #fff;
            border-radius: 0 8px 8px 8px;
            min-height: 200px;
        }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #e0e0e0; white-space: nowrap; }
        
        /* 表頭樣式與排序指標 */
        th {
            background-color: #2c3e50;
            color: white;
            position: sticky;
            top: 0;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }
        th:hover { opacity: 0.85; }
        .batter-header th { background-color: #d35400; }
        .pitcher-header th { background-color: #2980b9; }

        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #e9ecef; }
        .error-msg { color: #d9534f; padding: 20px; text-align: center; font-size: 16px; }
    </style>
</head>
<body>

    <h2>MLB 球員資料庫</h2>

    <!-- 切換分頁：只保留打者與投手 -->
    <div class="tab-container">
        <button class="tab-button active" onclick="switchTab('batter', this)">⚾ 打者列表 (Batter)</button>
        <button class="tab-button" onclick="switchTab('pitcher', this)">🥎 投手列表 (Pitcher)</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋球員名稱或隊伍..." onkeyup="filterTable()">
    </div>

    <div id="errorMessage" class="error-msg" style="display: none;"></div>

    <div class="table-container">
        <table id="playerTable">
            <thead><tr id="tableHeader"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        // 安全讀取 JSON 檔案
        async function fetchJsonSafely(filename) {
            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error('HTTP status ' + response.status);
                return await response.json();
            } catch (err) {
                console.warn(`無法讀取 ${filename}:`, err);
                return null;
            }
        }

        async function loadData(mode) {
            const headerRow = document.getElementById('tableHeader');
            const bodyContainer = document.getElementById('tableBody');
            const errorContainer = document.getElementById('errorMessage');

            headerRow.innerHTML = '';
            bodyContainer.innerHTML = '';
            errorContainer.style.display = 'none';
            document.getElementById('searchInput').value = '';

            let data = null;
            if (mode === 'batter') {
                data = await fetchJsonSafely('batter.json');
                headerRow.className = 'batter-header';
            } else if (mode === 'pitcher') {
                data = await fetchJsonSafely('pitcher.json');
                headerRow.className = 'pitcher-header';
            }

            if (!data) {
                errorContainer.innerHTML = `
                    <strong>⚠️ 資料載入失敗！</strong><br>
                    請確認 ${mode}.json 檔案已放置好，且專案已透過 Web Server / GitHub Pages 執行。
                `;
                errorContainer.style.display = 'block';
                return;
            }

            renderHeader(data[0]);
            renderBody(data[0], data.slice(1));
        }

        // 渲染表頭 (儲存原始標題，解決箭頭重複問題)
        function renderHeader(headers) {
            const headerRow = document.getElementById('tableHeader');
            const keys = Object.keys(headers);

            keys.forEach((key, colIndex) => {
                const th = document.createElement('th');
                const rawText = headers[key];
                
                th.dataset.label = rawText; // 記住乾淨原始文字
                th.textContent = rawText + ' ⇅';
                th.dataset.order = 'desc';
                th.onclick = () => sortTable(colIndex, th);
                
                headerRow.appendChild(th);
            });
        }

        // 渲染內容
        function renderBody(headers, rows) {
            const bodyContainer = document.getElementById('tableBody');
            const keys = Object.keys(headers);

            rows.forEach(rowData => {
                const tr = document.createElement('tr');
                keys.forEach(key => {
                    const td = document.createElement('td');
                    td.textContent = rowData[key] !== undefined ? rowData[key] : '-';
                    tr.appendChild(td);
                });
                bodyContainer.appendChild(tr);
            });
        }

        // 排序演算邏輯
        function sortTable(colIndex, headerElement) {
            const tbody = document.getElementById('tableBody');
            const rows = Array.from(tbody.querySelectorAll('tr'));
            const isAsc = headerElement.dataset.order === 'asc';
            
            // 1. 還原所有表頭為初始狀態 (清除多餘箭頭)
            const allHeaders = document.querySelectorAll('#tableHeader th');
            allHeaders.forEach(th => {
                const rawLabel = th.dataset.label;
                th.textContent = rawLabel + ' ⇅';
                if (th !== headerElement) {
                    th.dataset.order = 'desc';
                }
            });

            // 2. 數據排序 (支援數字與文字)
            rows.sort((rowA, rowB) => {
                let cellA = rowA.children[colIndex].textContent.trim();
                let cellB = rowB.children[colIndex].textContent.trim();

                let numA = parseFloat(cellA.replace(/[%$,]/g, ''));
                let numB = parseFloat(cellB.replace(/[%$,]/g, ''));

                if (!isNaN(numA) && !isNaN(numB)) {
                    return isAsc ? numA - numB : numB - numA;
                } else {
                    return isAsc ? cellA.localeCompare(cellB) : cellB.localeCompare(cellA);
                }
            });

            // 3. 重新放回排序後的 DOM
            rows.forEach(row => tbody.appendChild(row));

            // 4. 設定當前標題單一箭頭 (▲ / ▼)
            const currentLabel = headerElement.dataset.label;
            if (isAsc) {
                headerElement.textContent = currentLabel + ' ▲';
                headerElement.dataset.order = 'desc';
            } else {
                headerElement.textContent = currentLabel + ' ▼';
                headerElement.dataset.order = 'asc';
            }
        }

        // 切換頁籤
        function switchTab(mode, btn) {
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadData(mode);
        }

        // 關鍵字搜尋
        function filterTable() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(keyword) ? '' : 'none';
            });
        }

        // 網頁開啟預設載入打者列表
        window.onload = function() {
            loadData('batter');
        };
    </script>
</body>
</html>
