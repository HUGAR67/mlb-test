<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB 球員資料庫</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }
        h2 { color: #333; margin-bottom: 15px; }
        .section-title {
            color: #2c3e50;
            margin: 20px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tab-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-button {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background-color: #e0e0e0;
            color: #333;
            border-radius: 6px 6px 0 0;
            transition: 0.3s;
        }
        .tab-button.active { background-color: #2c3e50; color: white; }
        .tab-button:hover:not(.active) { background-color: #d0d0d0; }
        .search-container { margin-bottom: 15px; }
        .search-input {
            width: 100%;
            max-width: 300px;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .table-container {
            overflow-x: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background: #fff;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #e0e0e0; white-space: nowrap; }
        
        /* 表頭排序效果 */
        th {
            background-color: #2c3e50;
            color: white;
            position: sticky;
            top: 0;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }
        th:hover { opacity: 0.85; }
        .batter-header th { background-color: #d35400; }
        .pitcher-header th { background-color: #2980b9; }
        
        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #e9ecef; }
        .error-msg { color: #d9534f; padding: 20px; text-align: center; font-size: 16px; }
    </style>
</head>
<body>

    <h2>MLB 球員資料庫</h2>

    <div class="tab-container">
        <button class="tab-button active" onclick="switchTab('all', this)">全部球員庫 (All)</button>
        <button class="tab-button" onclick="switchTab('batter', this)">打者列表 (Batter)</button>
        <button class="tab-button" onclick="switchTab('pitcher', this)">投手列表 (Pitcher)</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋球員名稱或隊伍..." onkeyup="filterTable()">
    </div>

    <div id="errorMessage" class="error-msg" style="display: none;"></div>

    <!-- 容器區域 (可動態渲染多個表格) -->
    <div id="tablesWrapper"></div>

    <script>
        async function fetchJsonSafely(filename) {
            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error('HTTP status ' + response.status);
                return await response.json();
            } catch (err) {
                console.warn(`無法讀取 ${filename}:`, err);
                return null;
            }
        }

        async function loadData(mode) {
            const wrapper = document.getElementById('tablesWrapper');
            const errorContainer = document.getElementById('errorMessage');

            wrapper.innerHTML = '';
            errorContainer.style.display = 'none';
            document.getElementById('searchInput').value = '';

            const batterData = await fetchJsonSafely('batter.json');
            const pitcherData = await fetchJsonSafely('pitcher.json');

            if (!batterData && !pitcherData) {
                errorContainer.innerHTML = `
                    <strong>⚠️ 資料無法載入！</strong><br>
                    請確認 batter.json 與 pitcher.json 已正確放置，且透過 Live Server 啟動頁面。
                `;
                errorContainer.style.display = 'block';
                return;
            }

            if (mode === 'all') {
                if (batterData && batterData.length > 0) {
                    createSingleTable('⚾ 打者資料庫', batterData, 'batter');
                }
                if (pitcherData && pitcherData.length > 0) {
                    createSingleTable('🥎 投手資料庫', pitcherData, 'pitcher');
                }
            } else if (mode === 'batter') {
                if (!batterData) { showError('無法讀取 batter.json'); return; }
                createSingleTable('⚾ 打者資料庫', batterData, 'batter');
            } else if (mode === 'pitcher') {
                if (!pitcherData) { showError('無法讀取 pitcher.json'); return; }
                createSingleTable('🥎 投手資料庫', pitcherData, 'pitcher');
            }
        }

        // 建立單一獨立表格並附加排序功能
        function createSingleTable(title, data, type) {
            const wrapper = document.getElementById('tablesWrapper');

            const sectionTitle = document.createElement('h3');
            sectionTitle.className = 'section-title';
            sectionTitle.innerHTML = title;
            wrapper.appendChild(sectionTitle);

            const container = document.createElement('div');
            container.className = 'table-container';

            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const tbody = document.createElement('tbody');

            const headerRow = document.createElement('tr');
            headerRow.className = type === 'batter' ? 'batter-header' : 'pitcher-header';

            const headers = data[0];
            const keys = Object.keys(headers);

            // 建立點擊可排序的表頭
            keys.forEach((key, colIndex) => {
                const th = document.createElement('th');
                th.textContent = headers[key] + ' ⇅';
                th.dataset.order = 'desc'; // 預設點擊後第一次為降冪排序 (由大到小)
                th.onclick = () => sortTable(table, colIndex, th);
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);

            // 填入資料列
            const rows = data.slice(1);
            rows.forEach(rowData => {
                const tr = document.createElement('tr');
                keys.forEach(key => {
                    const td = document.createElement('td');
                    td.textContent = rowData[key] !== undefined ? rowData[key] : '-';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            table.appendChild(thead);
            table.appendChild(tbody);
            container.appendChild(table);
            wrapper.appendChild(container);
        }

        // 表格排序核心演算法 (智慧判斷數字與文字)
        function sortTable(table, colIndex, headerElement) {
            const tbody = table.querySelector('tbody');
            const rows = Array.from(tbody.querySelectorAll('tr'));
            const isAsc = headerElement.dataset.order === 'asc';
            
            // 重置同一個表頭其他欄位的箭頭符號
            const allHeaders = table.querySelectorAll('th');
            allHeaders.forEach(th => {
                if (th !== headerElement) {
                    th.textContent = th.textContent.replace(/[ ▲▼]/g, '') + ' ⇅';
                    th.dataset.order = 'desc';
                }
            });

            // 進行排序
            rows.sort((rowA, rowB) => {
                let cellA = rowA.children[colIndex].textContent.trim();
                let cellB = rowB.children[colIndex].textContent.trim();

                // 轉為數字進行比對（包含浮點數與百分比）
                let numA = parseFloat(cellA.replace(/[%$,]/g, ''));
                let numB = parseFloat(cellB.replace(/[%$,]/g, ''));

                if (!isNaN(numA) && !isNaN(numB)) {
                    return isAsc ? numA - numB : numB - numA;
                } else {
                    return isAsc ? cellA.localeCompare(cellB) : cellB.localeCompare(cellA);
                }
            });

            // 重新填回排序後的結果
            rows.forEach(row => tbody.appendChild(row));

            // 更新排序狀態與顯示指標
            const rawTitle = headerElement.textContent.replace(/[ ⇅▲▼]/g, '');
            if (isAsc) {
                headerElement.textContent = rawTitle + ' ▲';
                headerElement.dataset.order = 'desc';
            } else {
                headerElement.textContent = rawTitle + ' ▼';
                headerElement.dataset.order = 'asc';
            }
        }

        function switchTab(mode, btn) {
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadData(mode);
        }

        function filterTable() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('tbody tr');
            rows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(keyword) ? '' : 'none';
            });
        }

        function showError(msg) {
            const errorContainer = document.getElementById('errorMessage');
            errorContainer.innerHTML = msg;
            errorContainer.style.display = 'block';
        }

        window.onload = function() {
            loadData('all');
        };
    </script>
</body>
</html>
