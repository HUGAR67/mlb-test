<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB 球員資料庫</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }
        h2 { color: #333; margin-bottom: 15px; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-button {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background-color: #e0e0e0;
            color: #333;
            border-radius: 6px 6px 0 0;
            transition: 0.3s;
        }
        .tab-button.active { background-color: #2c3e50; color: white; }
        .tab-button:hover:not(.active) { background-color: #d0d0d0; }
        
        .control-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-input {
            width: 100%;
            max-width: 280px;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-reset {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background-color: #e74c3c;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-reset:hover { background-color: #c0392b; }

        .table-container {
            overflow-x: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background: #fff;
            border-radius: 0 8px 8px 8px;
            min-height: 200px;
        }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #e0e0e0; white-space: nowrap; }
        
        /* 表頭樣式 */
        th {
            background-color: #2c3e50;
            color: white;
            position: sticky;
            top: 0;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }
        th:hover { opacity: 0.85; }
        .batter-header th { background-color: #d35400; }
        .pitcher-header th { background-color: #2980b9; }

        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #e9ecef; }
        .error-msg { color: #d9534f; padding: 20px; text-align: center; font-size: 16px; }
    </style>
</head>
<body>

    <h2>MLB 球員資料庫</h2>

    <div class="tab-container">
        <button class="tab-button active" onclick="switchTab('batter', this)">⚾ 打者列表 (Batter)</button>
        <button class="tab-button" onclick="switchTab('pitcher', this)">🥎 投手列表 (Pitcher)</button>
    </div>

    <div class="control-container">
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋球員名稱或隊伍..." onkeyup="filterTable()">
        <button class="btn-reset" onclick="resetSort()">🔄 重置排序條件</button>
    </div>

    <div id="errorMessage" class="error-msg" style="display: none;"></div>

    <div class="table-container">
        <table id="playerTable">
            <thead><tr id="tableHeader"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        // 紀錄排序順序：先點的永遠在最前面（第一優先）
        let sortRules = [];
        let originalRowsData = []; // 保存原始讀取的資料備份，以便重置

        async function fetchJsonSafely(filename) {
            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error('HTTP status ' + response.status);
                return await response.json();
            } catch (err) {
                console.warn(`無法讀取 ${filename}:`, err);
                return null;
            }
        }

        async function loadData(mode) {
            const headerRow = document.getElementById('tableHeader');
            const bodyContainer = document.getElementById('tableBody');
            const errorContainer = document.getElementById('errorMessage');

            headerRow.innerHTML = '';
            bodyContainer.innerHTML = '';
            errorContainer.style.display = 'none';
            document.getElementById('searchInput').value = '';
            
            sortRules = []; // 切換頁籤重置排序條件

            let data = null;
            if (mode === 'batter') {
                data = await fetchJsonSafely('batter.json');
                headerRow.className = 'batter-header';
            } else if (mode === 'pitcher') {
                data = await fetchJsonSafely('pitcher.json');
                headerRow.className = 'pitcher-header';
            }

            if (!data) {
                errorContainer.innerHTML = `
                    <strong>⚠️ 資料載入失敗！</strong><br>
                    請確認 ${mode}.json 檔案已放置好，且專案已透過 Web Server / GitHub Pages 執行。
                `;
                errorContainer.style.display = 'block';
                return;
            }

            originalRowsData = data.slice(1);
            renderHeader(data[0]);
            renderBody(data[0], originalRowsData);
        }

        function renderHeader(headers) {
            const headerRow = document.getElementById('tableHeader');
            const keys = Object.keys(headers);

            keys.forEach((key, colIndex) => {
                const th = document.createElement('th');
                const rawText = headers[key];
                
                th.dataset.label = rawText;
                th.dataset.col = colIndex;
                th.textContent = rawText + ' ⇅';
                th.onclick = () => handleSortClick(colIndex);
                
                headerRow.appendChild(th);
            });
        }

        function renderBody(headers, rows) {
            const bodyContainer = document.getElementById('tableBody');
            bodyContainer.innerHTML = '';
            const keys = Object.keys(headers);

            rows.forEach(rowData => {
                const tr = document.createElement('tr');
                keys.forEach(key => {
                    const td = document.createElement('td');
                    td.textContent = rowData[key] !== undefined ? rowData[key] : '-';
                    tr.appendChild(td);
                });
                bodyContainer.appendChild(tr);
            });
        }

        // 點擊排序邏輯（先點的保持最前）
        function handleSortClick(colIndex) {
            const existingRuleIndex = sortRules.findIndex(rule => rule.colIndex === colIndex);

            if (existingRuleIndex !== -1) {
                // 如果是已經點過的欄位：切換升降冪方向（保持在原本的順位，不改變優先序）
                const currentDir = sortRules[existingRuleIndex].dir;
                if (currentDir === 'desc') {
                    sortRules[existingRuleIndex].dir = 'asc';
                } else {
                    // 第三次點擊：從排序條件中移除
                    sortRules.splice(existingRuleIndex, 1);
                }
            } else {
                // 新點擊的欄位：追加到佇列最後面（作為次要、第三要條件）
                sortRules.push({ colIndex: colIndex, dir: 'desc' });
            }

            applyMultiSort();
            updateHeaderUI();
        }

        // 多重條件排序演算
        function applyMultiSort() {
            const tbody = document.getElementById('tableBody');
            const rows = Array.from(tbody.querySelectorAll('tr'));

            if (sortRules.length === 0) return;

            rows.sort((rowA, rowB) => {
                // 按照點擊的先後順序依次比對
                for (let rule of sortRules) {
                    const colIndex = rule.colIndex;
                    const isAsc = rule.dir === 'asc';

                    let cellA = rowA.children[colIndex].textContent.trim();
                    let cellB = rowB.children[colIndex].textContent.trim();

                    let numA = parseFloat(cellA.replace(/[%$,]/g, ''));
                    let numB = parseFloat(cellB.replace(/[%$,]/g, ''));

                    let comparison = 0;
                    if (!isNaN(numA) && !isNaN(numB)) {
                        comparison = isAsc ? numA - numB : numB - numA;
                    } else {
                        comparison = isAsc ? cellA.localeCompare(cellB) : cellB.localeCompare(cellA);
                    }

                    // 若不平手，直接決定順序；若平手，才比下一個條件
                    if (comparison !== 0) {
                        return comparison;
                    }
                }
                return 0;
            });

            rows.forEach(row => tbody.appendChild(row));
        }

        // 重置所有排序
        function resetSort() {
            sortRules = [];
            
            // 重新讀取當前模式並刷新 UI
            const activeTab = document.querySelector('.tab-button.active');
            const mode = activeTab.textContent.includes('打者') ? 'batter' : 'pitcher';
            loadData(mode);
        }

        // 更新 UI 標示（以 ①, ②, ③ 標明優先層級）
        function updateHeaderUI() {
            const allHeaders = document.querySelectorAll('#tableHeader th');

            allHeaders.forEach(th => {
                const colIndex = parseInt(th.dataset.col);
                const rawLabel = th.dataset.label;
                
                const ruleIndex = sortRules.findIndex(rule => rule.colIndex === colIndex);

                if (ruleIndex !== -1) {
                    const dirSymbol = sortRules[ruleIndex].dir === 'desc' ? '▼' : '▲';
                    const priorityNumber = getCircleNumber(ruleIndex + 1);
                    th.textContent = `${rawLabel} ${priorityNumber}${dirSymbol}`;
                } else {
                    th.textContent = `${rawLabel} ⇅`;
                }
            });
        }

        function getCircleNumber(n) {
            const circles = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩'];
            return circles[n - 1] || `(${n})`;
        }

        function switchTab(mode, btn) {
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadData(mode);
        }

        function filterTable() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(keyword) ? '' : 'none';
            });
        }

        window.onload = function() {
            loadData('batter');
        };
    </script>
</body>
</html>
