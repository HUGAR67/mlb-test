<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB 球員資料庫</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }
        h2 { color: #333; margin-bottom: 15px; }
        .section-title {
            color: #2c3e50;
            margin: 25px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tab-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-button {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background-color: #e0e0e0;
            color: #333;
            border-radius: 6px 6px 0 0;
            transition: 0.3s;
        }
        .tab-button.active { background-color: #2c3e50; color: white; }
        .tab-button:hover:not(.active) { background-color: #d0d0d0; }
        .search-container { margin-bottom: 15px; }
        .search-input {
            width: 100%;
            max-width: 300px;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .table-container {
            overflow-x: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background: #fff;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #e0e0e0; white-space: nowrap; }
        th { background-color: #2c3e50; color: white; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #e9ecef; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; color: #fff; }
        .badge-batter { background-color: #e67e22; }
        .badge-pitcher { background-color: #2980b9; }
        .error-msg { color: #d9534f; padding: 20px; text-align: center; font-size: 16px; }
    </style>
</head>
<body>

    <h2>MLB 球員資料庫</h2>

    <div class="tab-container">
        <button class="tab-button active" onclick="switchTab('all', this)">全部球員庫 (All)</button>
        <button class="tab-button" onclick="switchTab('batter', this)">打者列表 (Batter)</button>
        <button class="tab-button" onclick="switchTab('pitcher', this)">投手列表 (Pitcher)</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋球員名稱或隊伍..." onkeyup="filterTable()">
    </div>

    <!-- 動態渲染區域 -->
    <div id="viewsContainer"></div>
    <div id="errorMessage" class="error-msg" style="display: none;"></div>

    <script>
        // 容錯讀取 JSON
        async function fetchJsonSafely(filename) {
            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error('HTTP status ' + response.status);
                return await response.json();
            } catch (err) {
                console.warn(`無法直接讀取 ${filename}:`, err);
                return null;
            }
        }

        async function loadData(mode) {
            const viewsContainer = document.getElementById('viewsContainer');
            const errorContainer = document.getElementById('errorMessage');

            viewsContainer.innerHTML = '';
            errorContainer.style.display = 'none';
            document.getElementById('searchInput').value = '';

            const batterData = await fetchJsonSafely('batter.json');
            const pitcherData = await fetchJsonSafely('pitcher.json');

            if (!batterData && !pitcherData) {
                errorContainer.innerHTML = `
                    <strong>⚠️ 資料無法載入！</strong><br>
                    這是瀏覽器的安全性限制（CORS Policy）導致無法直接點開讀取本地檔。<br><br>
                    <strong>解決方式：</strong><br>
                    1. 使用 VS Code 安裝 <strong>Live Server</strong> 擴充套件開啟。<br>
                    2. 或使用 Python / Node.js 啟動本地 Server 開啟此頁面。
                `;
                errorContainer.style.display = 'block';
                return;
            }

            if (mode === 'all') {
                // 全部球員庫：分別渲染「打者表格」與「投手表格」
                if (batterData && batterData.length > 0) {
                    renderTableGroup('打者數據 (Batter)', 'batter', batterData[0], batterData.slice(1));
                }
                if (pitcherData && pitcherData.length > 0) {
                    renderTableGroup('投手數據 (Pitcher)', 'pitcher', pitcherData[0], pitcherData.slice(1));
                }
            } else if (mode === 'batter') {
                if (!batterData) { showError('無法讀取 batter.json'); return; }
                renderTableGroup('打者列表 (Batter)', 'batter', batterData[0], batterData.slice(1));
            } else if (mode === 'pitcher') {
                if (!pitcherData) { showError('無法讀取 pitcher.json'); return; }
                renderTableGroup('投手列表 (Pitcher)', 'pitcher', pitcherData[0], pitcherData.slice(1));
            }
        }

        // 建立單個數據表格組
        function renderTableGroup(title, type, headers, rows) {
            const viewsContainer = document.getElementById('viewsContainer');

            // 1. 建立標題與 Badge 標籤
            const sectionTitle = document.createElement('h3');
            sectionTitle.className = 'section-title';
            
            const badge = document.createElement('span');
            badge.className = `badge ${type === 'batter' ? 'badge-batter' : 'badge-pitcher'}`;
            badge.textContent = type === 'batter' ? '打者' : '投手';
            
            sectionTitle.appendChild(badge);
            sectionTitle.appendChild(document.createTextNode(title));
            viewsContainer.appendChild(sectionTitle);

            // 2. 建立表格容器與 Table
            const tableContainer = document.createElement('div');
            tableContainer.className = 'table-container';

            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const tbody = document.createElement('tbody');

            // 表頭 Header
            const trHeader = document.createElement('tr');
            Object.keys(headers).forEach(key => {
                const th = document.createElement('th');
                th.textContent = headers[key];
                trHeader.appendChild(th);
            });
            thead.appendChild(trHeader);

            // 資料列 Body
            rows.forEach(rowData => {
                const tr = document.createElement('tr');
                Object.keys(headers).forEach(key => {
                    const td = document.createElement('td');
                    td.textContent = rowData[key] !== undefined ? rowData[key] : '-';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            table.appendChild(thead);
            table.appendChild(tbody);
            tableContainer.appendChild(table);
            viewsContainer.appendChild(tableContainer);
        }

        function switchTab(mode, btn) {
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadData(mode);
        }

        // 搜尋過濾功能（可同時搜尋多個表格）
        function filterTable() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const allRows = document.querySelectorAll('#viewsContainer tbody tr');
            
            allRows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(keyword) ? '' : 'none';
            });
        }

        function showError(msg) {
            const errorContainer = document.getElementById('errorMessage');
            errorContainer.innerHTML = msg;
            errorContainer.style.display = 'block';
        }

        window.onload = function() {
            loadData('all');
        };
    </script>
</body>
</html>
